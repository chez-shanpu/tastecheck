name: Renovate

# Self-hosted Renovate that updates aqua packages only (see .github/renovate.json).
# Go modules and GitHub Actions are updated by Dependabot.

on:
  schedule:
    - cron: "0 0 * * 1" # Every Monday 09:00 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    name: Renovate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: renovate
    env:
      # The Renovate container mounts /tmp, so aqua installed here can run in
      # postUpgradeTasks to update aqua-checksums.json.
      AQUA_ROOT_DIR: /tmp/aqua-root
    steps:
      # Needed for configurationFile; Renovate clones the repository itself.
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install aqua
        uses: aquaproj/aqua-installer@v4.1.1
        with:
          aqua_version: v2.66.0
          enable_aqua_install: "false"

      # The container runs as a different user.
      - name: Make aqua usable from the Renovate container
        run: chmod -R a+rwX "${AQUA_ROOT_DIR}"

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-administration: read
          permission-checks: write
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
          permission-vulnerability-alerts: read
          permission-workflows: write

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.12
        with:
          token: ${{ steps.app-token.outputs.token }}
          configurationFile: .github/renovate-config.js
          renovate-version: 44.206.2
          additional-env-list: |
            AQUA_ROOT_DIR
            AQUA_GITHUB_TOKEN
        env:
          # Read-only token for aqua to avoid GitHub API rate limits.
          AQUA_GITHUB_TOKEN: ${{ github.token }}
